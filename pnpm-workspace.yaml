# Proyecto de un solo paquete. "packages" es obligatorio para pnpm 9
# (sin él falla con "packages field missing or empty").
packages:
  - "."

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true

# Seguridad de la cadena de suministro: no instalar versiones publicadas
# hace menos de 24 h (comportamiento por defecto de pnpm 11+).
minimumReleaseAge: 1440
